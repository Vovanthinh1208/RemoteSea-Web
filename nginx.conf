server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html's own CSP <meta> tag deliberately omits frame-ancestors —
    # the CSP spec requires that directive to come from an HTTP response
    # header, browsers silently ignore it in a <meta> tag (see the comment
    # right above that tag: "Set it ... at the hosting/server layer
    # instead"). This is that layer. X-Frame-Options is the older,
    # widely-supported equivalent for browsers that don't honor
    # frame-ancestors.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite's hashed asset filenames (dist/assets/*-<hash>.js) change name
    # whenever content changes, so caching them forever is safe — a
    # deploy's new index.html references new hashed filenames, never
    # reuses a stale cached one under the old name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: React Router (BrowserRouter, see src/app/providers.tsx)
    # handles routing client-side, so a hard refresh or direct link to e.g.
    # /jobs/123 must still serve index.html rather than 404 — nginx has no
    # route table of its own to match it against.
    location / {
        try_files $uri /index.html;
    }
}
