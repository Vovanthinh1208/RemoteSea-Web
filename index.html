<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      frame-ancestors (clickjacking protection) is intentionally omitted here — the CSP spec
      requires it to come from an HTTP response header, browsers silently ignore it in a
      <meta> tag. Set it (or X-Frame-Options) at the hosting/server layer instead.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com; connect-src 'self' %VITE_API_URL% https://www.google-analytics.com https://*.ingest.sentry.io; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Curated remote jobs from Singapore, Australia & beyond — for Vietnam talent. Clear salary ranges, verified employers, sensible timezones."
    />
    <!--
      Site-wide defaults — useDocumentTitle overwrites og:title/og:description/og:url
      per route for pages that pass a description (job postings, talent profiles, etc.).
      No og:image tag: there's no real 1200x630 social-preview asset yet (only
      favicon.svg, which most link-preview crawlers won't render) — omitted rather
      than pointing at something broken.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RemoteSEA" />
    <meta property="og:title" content="RemoteSEA — Remote Jobs from SG, AU & beyond" />
    <meta
      property="og:description"
      content="Curated remote jobs from Singapore, Australia & beyond — for Vietnam talent. Clear salary ranges, verified employers, sensible timezones."
    />
    <meta property="og:url" content="https://remotesea.io/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RemoteSEA — Remote Jobs from SG, AU & beyond" />
    <meta
      name="twitter:description"
      content="Curated remote jobs from Singapore, Australia & beyond — for Vietnam talent. Clear salary ranges, verified employers, sensible timezones."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <title>RemoteSEA — Remote Jobs from SG, AU & beyond</title>
  </head>
  <body class="flex min-h-screen flex-col bg-neutral-50 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
