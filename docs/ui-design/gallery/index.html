    <style>
      :root {
        --bg: #f8f7f4;
        --card: #fff;
        --fg: #1a1917;
        --muted: #5c5954;
        --line: #ddd9d1;
        --brand: #2e9b52;
        --brand-50: #f0f9f4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 Inter,
          system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding: 16px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      header p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 13px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      input,
      select {
        font: inherit;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        min-width: 0;
      }
      input {
        flex: 1 1 220px;
      }
      main {
        padding: 16px;
        max-width: 1440px;
        margin: 0 auto;
      }
      h2 {
        font-size: 16px;
        margin: 28px 0 10px;
      }
      h3 {
        font-size: 13px;
        margin: 16px 0 8px;
        color: var(--muted);
        font-weight: 600;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
      }
      figure {
        margin: 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      figure a {
        display: block;
        background: #efede8;
        aspect-ratio: 16/10;
        overflow: hidden;
      }
      figure img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
      }
      figcaption {
        padding: 10px 12px;
        font-size: 12.5px;
      }
      figcaption b {
        display: block;
        font-size: 13px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 6px;
      }
      .tag {
        background: var(--brand-50);
        color: #1f7a3d;
        border-radius: 99px;
        padding: 1px 8px;
        font-size: 11px;
      }
      .tag.m {
        background: #efede8;
        color: var(--muted);
      }
      code {
        font-size: 11.5px;
        color: var(--muted);
        word-break: break-all;
      }
      .count {
        color: var(--muted);
        font-size: 12px;
        margin-left: 6px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1a1917;
          --card: #2c2a28;
          --fg: #f8f7f4;
          --muted: #c7c2b9;
          --line: #423f3c;
          --brand-50: #0d3d1f;
        }
        :root:not([data-theme="light"]) input,
        :root:not([data-theme="light"]) select {
          background: #2c2a28;
          color: var(--fg);
        }
      }
    </style>
  </head>

          route: "/admin?tab=audit-log",
          state: "Toàn trang desktop",

          full: true,
        },
      ];
      const NAMES = {
        1: "Sprint 1 — Nền tảng hệ thống, Xác thực & Danh mục chuẩn",
        2: "Sprint 2 — Hồ sơ ứng viên, Doanh nghiệp & Tin tuyển dụng",
        3: "Sprint 3 — Ứng tuyển, Phỏng vấn, Đánh giá, Tin nhắn & Thanh toán",
        4: "Sprint 4 — Dịch vụ AI, Cảnh báo, Quản trị Admin & Tích hợp",
        shared: "Dùng chung / chưa ánh xạ PB",
      };
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
        );
      function render() {
        const q = $("q").value.trim().toLowerCase(),
          sp = $("sprint").value,
          ac = $("actor").value,
          vp = $("vp").value;
        const list = ITEMS.filter(
          (i) =>
            (!sp || i.sprint === sp) &&
            (!ac || i.actor === ac) &&
            (!vp || i.viewport === vp) &&
            (!q ||
              [
                i.title,
                i.pbs.join(" "),
                i.route,
                i.state,
                i.file,
                i.screenId,
                i.feature,
              ]
                .join(" ")
                .toLowerCase()
                .includes(q))
        );
        let html = "";
        for (const s of ["1", "2", "3", "4", "shared"]) {
          const inS = list.filter((i) => i.sprint === s);
          if (!inS.length) continue;
          html +=
            "<h2>" +
            esc(NAMES[s]) +
            '<span class="count">' +
            inS.length +
            " ảnh</span></h2>";
          const byScreen = {};
          inS.forEach((i) => (byScreen[i.screenId] ||= []).push(i));
          for (const [id, arr] of Object.entries(byScreen)) {
            html +=
              "<h3>" +
              esc(id + " · " + arr[0].title + " · " + arr[0].pbs.join(", ")) +
              '</h3><div class="grid">';
            for (const i of arr)
              html +=
                '<figure><a href="' +
                esc(i.src) +
                '" target="_blank" rel="noopener"><img loading="lazy" src="' +
                esc(i.src) +
                '" alt="' +
                esc(i.title + " — " + i.state) +
                '"></a><figcaption><b>' +
                esc(i.state) +
                "</b><code>" +
                esc(i.file) +
                '</code><div class="tags">' +
                i.pbs
                  .map((p) => '<span class="tag">' + esc(p) + "</span>")
                  .join("") +
                '<span class="tag m">' +
                esc(i.actor) +
                '</span><span class="tag m">' +
                esc(i.viewport + (i.full ? " · full" : "")) +
                '</span><span class="tag m">' +
                esc(i.route) +
                "</span></div></figcaption></figure>";
            html += "</div>";
          }
        }
        $("out").innerHTML = html || "<p>Không có ảnh khớp bộ lọc.</p>";
      }
      ["q", "sprint", "actor", "vp"].forEach((id) =>
        $(id).addEventListener("input", render)
      );
      render();
    </script>
