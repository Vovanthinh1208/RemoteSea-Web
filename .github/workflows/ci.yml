name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo (no issue/PR/deploy writes needed).
permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run instead of
# letting redundant runs pile up and burn minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Guards against a hung step (e.g. a watch mode entered by mistake) holding
    # a runner for the 6-hour default.
    timeout-minutes: 15
    # Job-level on purpose: this used to sit on the build step, and inserting a
    # new step after `npm run build` silently detached it (YAML attached env to
    # the new last step) — the build then failed with "VITE_API_URL is not set".
    env:
      VITE_API_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      # Node 22 to match remotesea-api's CI and Docker base image.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Persist ESLint's per-file cache across runs (it lives in .cache/, which
      # survives npm ci — unlike node_modules) so re-linting a PR only re-checks
      # changed files. Keyed on the eslint config; restore-keys falls back to any
      # prior cache so even a config bump starts warm.
      - uses: actions/cache@v6
        with:
          path: .cache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js') }}
          restore-keys: |
            eslint-${{ runner.os }}-
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run depcruise
      - run: npm run test
      - run: npm run build
      # Fails the build if a chunk blows its gzip budget (.size-limit.json) —
      # catches an accidental heavy import before it ships.
      - run: npm run size
