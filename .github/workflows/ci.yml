name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Job-level on purpose: this used to sit on the build step, and inserting a
    # new step after `npm run build` silently detached it (YAML attached env to
    # the new last step) — the build then failed with "VITE_API_URL is not set".
    env:
      VITE_API_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      # Node 22 to match remotesea-api's CI and Docker base image.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run depcruise
      - run: npm run test
      - run: npm run build
